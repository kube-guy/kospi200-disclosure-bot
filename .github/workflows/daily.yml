name: 코스피200 주요공시 게시

on:
  schedule:
    # 21:00 UTC = 다음날 06:00 KST. 일~목(UTC) = 월~금(KST)
    - cron: '0 21 * * 0-4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제 게시하지 않고 카드만 생성 (아티팩트로 확인)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kospi200-disclosure
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm install

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 카드 생성
        run: node index.js build

      - name: 게시 여부 판정
        id: state
        run: |
          if [ ! -f out/post.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=$(jq -r '.skip' out/post.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: 카드 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disclosure-card
          path: |
            docs/cards/*.png
            out/post.json
          if-no-files-found: ignore
          retention-days: 14

      # Threads API는 로컬 파일 업로드를 지원하지 않고 공개 URL만 받는다.
      # 그래서 게시 전에 카드를 먼저 커밋해서 raw URL을 만들어 둔다.
      - name: 카드 커밋 및 푸시
        if: steps.state.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cards
          if git diff --staged --quiet; then
            echo "커밋할 변경이 없습니다"
          else
            git commit -m "card: $(jq -r '.cardName' out/post.json)"
            pushed=false
            for i in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi
              echo "push 실패 (${i}/3), 원격 변경분을 반영해 재시도합니다"
              git fetch origin main
              git rebase -X ours origin/main
            done
            if [ "$pushed" != "true" ]; then
              echo "3회 재시도 후에도 push 실패"
              exit 1
            fi
          fi

      - name: Threads 게시
        if: steps.state.outputs.skip == 'false'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOPIC_TAG: 주식
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node index.js post

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 실행 결과"
            if [ -f out/post.json ]; then
              echo ''
              echo '```json'
              jq '{skip, cardName, imageUrl, meta}' out/post.json
              echo '```'
              echo ''
              echo '#### 본문'
              echo ''
              jq -r '.caption // "(없음)"' out/post.json
            else
              echo '상태 파일이 없습니다.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 실패해도 알림이 없어 토큰 갱신이 3주, 공시 게시가 5일 동안 방치된 적이 있다.
  # 실패하면 이슈를 만들고, 이미 열린 이슈가 있으면 댓글만 달아 중복을 막는다.
  notify-failure:
    needs: publish
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 실패 이슈 생성
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          TITLE: '[자동] 코스피200 주요공시 게시 실패'
        run: |
          gh label create workflow-failure -R "$REPO" --color B60205 \
            --description '워크플로 자동 실패 알림' --force >/dev/null 2>&1 || true

          body=$(printf '%s\n\n- 실행 로그: %s\n- 트리거: %s\n- 시각(UTC): %s\n' \
            "워크플로가 실패했습니다." "$RUN_URL" "${{ github.event_name }}" "$(date -u '+%Y-%m-%d %H:%M')")

          existing=$(gh issue list -R "$REPO" --state open --label workflow-failure \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number")

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" -R "$REPO" --body "$body"
            echo "기존 이슈 #$existing 에 댓글을 남겼습니다."
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$body" --label workflow-failure
          fi
